name: Refresh Bayburt student data

on:
  push:
    branches: [main]
    paths:
      - "research/bayburt/seeds.json"
      - "scripts/collect_students.py"
      - ".github/workflows/bayburt-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public MEB school statistics
        run: python scripts/collect_students.py --seeds research/bayburt/seeds.json --output research/bayburt
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/bayburt/students-by-grade.json research/bayburt/checkpoint.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Bayburt school student snapshots"
          git push
