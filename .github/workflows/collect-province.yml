name: Collect province student data

on:
  workflow_dispatch:
    inputs:
      province_slug:
        description: "research/<province_slug>/config.json folder name"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: province-data-${{ inputs.province_slug }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate province config
        run: test -f "research/${{ inputs.province_slug }}/config.json"
      - name: Collect province
        run: python scripts/run_all.py --province "${{ inputs.province_slug }}"
      - name: Commit refreshed province dataset
        run: |
          SLUG="${{ inputs.province_slug }}"
          cp "research/$SLUG/students-by-grade.json" /tmp/students-by-grade.json
          cp "research/$SLUG/checkpoint.json" /tmp/checkpoint.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/students-by-grade.json "research/$SLUG/students-by-grade.json"
          cp /tmp/checkpoint.json "research/$SLUG/checkpoint.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "research/$SLUG/students-by-grade.json" "research/$SLUG/checkpoint.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh $SLUG school student snapshots"
          git push
